# Weekly refresh of the synthetic-data pipeline and dashboard.
# - runs on a schedule (Mondays 12:00 UTC), on demand, and on pull requests
# - rebuilds everything from scratch, runs the data-quality checks and tests
# - a critical data-quality failure fails the job, so a broken refresh is never committed
# - on the schedule or a manual run it commits the refreshed dashboard and alerts back to the repo
# SYNTHETIC DATA ONLY: Gulf Coast Builders is fictional.
name: weekly-refresh

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Rebuild, check, test (stops on any critical data-quality failure)
        run: python run_all.py --regen

      - name: Upload the dashboard and alert report
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-and-alerts
          path: |
            docs/index.html
            alerts/weekly_flagged_jobs.md

      - name: Commit refreshed outputs (schedule or manual run only)
        if: github.event_name != 'pull_request'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/data_dictionary.md docs/planted_defects.md alerts/weekly_flagged_jobs.md
          git diff --cached --quiet && echo "No changes to commit" || (git commit -m "Weekly refresh of synthetic dashboard and alerts" && git push)
